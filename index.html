<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
  <title>Zona Smart TV - LG WebOS 4</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-root">

    <!-- Hero Backdrop Banner -->
    <div id="hero-backdrop" class="hero-backdrop-container"></div>

    <!-- Navigation Header -->
    <header class="navbar">
      <div class="brand-logo">
        <img src="icon.png" alt="Zona TV Logo">
        <span class="brand-title">ZONA TV</span>
      </div>
      <nav class="nav-tabs">
        <button class="nav-tab focusable active" data-tab="movies" tabindex="0">Фильмы</button>
        <button class="nav-tab focusable" data-tab="series" tabindex="0">Сериалы</button>
        <button class="nav-tab focusable" data-tab="tv" tabindex="0">ТВ Каналы</button>
        <button class="nav-tab focusable" data-tab="favorites" tabindex="0">Избранное</button>
        <button class="nav-tab focusable" data-tab="search" tabindex="0">🔍 Поиск</button>
      </nav>
    </header>

    <!-- Hero Feature Area -->
    <div class="hero-content">
      <h1 id="hero-title" class="hero-title">Загрузка...</h1>
      <div id="hero-meta" class="hero-meta">
        <span class="rating-badge">&#9733; --</span>
        <span>----</span>
        <span>HD 1080p</span>
      </div>
      <p id="hero-desc" class="hero-desc">Выберите фильм или сериал из каталога для просмотра.</p>
      <div class="hero-actions">
        <button id="hero-play-btn" class="btn-primary focusable" tabindex="0">&#9654; Смотреть</button>
        <button id="hero-fav-btn" class="btn-secondary focusable" tabindex="0">&#9825; В Избранное</button>
      </div>
    </div>

    <!-- Catalog Section -->
    <main class="main-content">
      <!-- Search Bar (Shown in Search Tab) -->
      <div id="search-bar" class="search-container hidden">
        <input type="text" id="search-input" class="search-input focusable" placeholder="Введите название фильма или сериала..." tabindex="0">
        <button id="search-btn" class="btn-primary search-btn focusable" tabindex="0">Искать</button>
      </div>

      <h2 id="catalog-title" class="catalog-title">Популярные Фильмы</h2>
      <div id="main-loading-spinner" class="loading-spinner hidden">Загрузка каталога Zona...</div>
      <div id="catalog-grid" class="catalog-grid"></div>
    </main>

    <!-- Movie Detail Modal Window -->
    <div id="detail-modal" class="modal-backdrop hidden">
      <div class="modal-dialog">
        <button id="modal-close-btn" class="modal-close-btn focusable" tabindex="0">&times;</button>
        <div class="modal-poster-col">
          <img id="modal-poster" src="assets/poster_placeholder.png" alt="Poster">
        </div>
        <div class="modal-info-col">
          <h2 id="modal-title" class="modal-title">Название Фильма</h2>
          <div class="modal-meta">
            <span id="modal-rating" class="rating-badge">&#9733; 8.5</span>
            <span id="modal-year">2024</span>
          </div>
          <p id="modal-desc" class="modal-desc">Описание фильма...</p>
          <div class="modal-sources-title">Доступные источники и качество:</div>
          <div id="modal-sources-list" class="modal-sources-list"></div>
        </div>
      </div>
    </div>

    <!-- Fullscreen Player Container -->
    <div id="player-container" class="player-container hidden">
      <video id="main-video-player" crossorigin="anonymous" playsinline></video>
      
      <!-- Player OSD Overlay Controls -->
      <div id="player-controls" class="player-controls">
        <div id="player-video-title" class="player-info">Воспроизведение...</div>
        <div id="player-progress-bar" class="player-progress-wrapper">
          <div id="player-progress-filled" class="player-progress-filled"></div>
        </div>
        <div class="player-time-row">
          <span id="player-time-current">00:00</span>
          <span id="player-time-total">00:00</span>
        </div>
        <div class="player-btns-row">
          <button id="player-btn-rw" class="player-control-btn focusable" onclick="PlayerApp.seek(-30)" tabindex="0">&#9194;</button>
          <button id="player-btn-play" class="player-control-btn focusable" onclick="PlayerApp.togglePlay()" tabindex="0">&#9654;</button>
          <button id="player-btn-ff" class="player-control-btn focusable" onclick="PlayerApp.seek(30)" tabindex="0">&#9197;</button>
          <button id="player-btn-close" class="player-control-btn focusable" onclick="PlayerApp.close()" tabindex="0">&#10006;</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
