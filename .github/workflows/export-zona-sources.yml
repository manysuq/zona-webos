name: Export Zona sources

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export-zona-sources.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/apk-analysis

      - name: Install JADX
        run: |
          set -euo pipefail
          URL=$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)
          mkdir -p "$RUNNER_TEMP/jadx"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/jadx.zip"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          echo "$RUNNER_TEMP/jadx/bin" >> "$GITHUB_PATH"

      - name: Decompile APK
        run: |
          set +e
          rm -rf /tmp/zona-jadx
          jadx --show-bad-code --deobf -d /tmp/zona-jadx zona5.apk > /tmp/jadx.log 2>&1
          echo "JADX exit: $?"
          exit 0

      - name: Export application code
        run: |
          set -euo pipefail
          rm -rf zona-source-export
          mkdir -p zona-source-export/app zona-source-export/reports

          if [ -d /tmp/zona-jadx/sources/ru/zona ]; then
            cp -R /tmp/zona-jadx/sources/ru/zona zona-source-export/app/
          fi

          find /tmp/zona-jadx/sources -type f -name '*.java' -print0 | xargs -0 grep -IlE 'mzona|zonasearch|zona\\.pub|zona\\.plus|getVideoSources|getMovieIds|getSerialIds|kinopoisk|movieSource|torrent|magnet' | head -n 500 > /tmp/matches.txt || true
          while IFS= read -r src; do
            [ -f "$src" ] || continue
            rel="${src#/tmp/zona-jadx/sources/}"
            dst="zona-source-export/matched/$rel"
            mkdir -p "$(dirname "$dst")"
            cp "$src" "$dst"
          done < /tmp/matches.txt

          grep -RhoEI 'https?://[^"'"'"'<>[:space:]\\]+' zona-source-export/app zona-source-export/matched 2>/dev/null | sort -u > zona-source-export/reports/urls.txt || true
          grep -RniEI 'getMovieIds|getSerialIds|getVideoSources|kinopoisk|torrent|magnet|mzona|zonasearch|zona\\.pub|zona\\.plus' zona-source-export/app zona-source-export/matched > zona-source-export/reports/api-references.txt 2>/dev/null || true
          find zona-source-export/app -type f | sort > zona-source-export/reports/app-files.txt
          cp /tmp/jadx.log zona-source-export/reports/jadx.log

      - name: Publish source export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f zona-source-export
          if ! git diff --cached --quiet; then
            git commit -m "analysis: export Zona application sources [skip ci]"
            git push origin HEAD:chore/apk-analysis
          fi
