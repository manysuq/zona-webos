name: Export Zona bootstrap callers
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/export-network-core.yml"]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/apk-analysis
          fetch-depth: 0
      - name: Install JADX
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n1)
          mkdir -p /tmp/jadx-bin /tmp/zona-jadx /tmp/zona-export
          curl -fsSL "$URL" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
      - name: Decompile APK
        run: |
          set +e
          /tmp/jadx-bin/bin/jadx --show-bad-code --deobf -d /tmp/zona-jadx zona5.apk >/tmp/jadx-bootstrap.log 2>&1
          exit 0
      - name: Collect bootstrap, models and entity callers
        run: |
          mkdir -p /tmp/zona-export/callers /tmp/zona-export/models
          grep -RIlE 'm2185d|initApiConfig|Using builtin config|getMovieOrSerialById|m20535d' /tmp/zona-jadx/sources | while read -r src; do
            rel=${src#/tmp/zona-jadx/sources/}
            mkdir -p "/tmp/zona-export/callers/$(dirname "$rel")"
            cp "$src" "/tmp/zona-export/callers/$rel"
          done
          for rel in p179Jg/EnumC2623b.java p179Jg/C2631j.java p179Jg/C2616L.java p464Zd/C6810h.java ru/zona/app/android/App.java; do
            src="/tmp/zona-jadx/sources/$rel"
            if [ -f "$src" ]; then mkdir -p "/tmp/zona-export/models/$(dirname "$rel")"; cp "$src" "/tmp/zona-export/models/$rel"; fi
          done
          grep -RniE 'm2185d|initApiConfig|builtin config|getMovieOrSerialById|m20535d|https?://' /tmp/zona-export > /tmp/zona-export/callsites.txt || true
          cp /tmp/jadx-bootstrap.log /tmp/zona-export/jadx.log
      - name: Publish from latest branch head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin chore/apk-analysis
          rm -rf network-core-export/callers network-core-export/models network-core-export/callsites.txt
          mkdir -p network-core-export
          cp -R /tmp/zona-export/. network-core-export/
          git add -f network-core-export
          git commit -m "analysis: export builtin Zona bootstrap config [skip ci]" || exit 0
          git push origin HEAD:chore/apk-analysis
