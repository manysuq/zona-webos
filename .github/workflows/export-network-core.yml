name: Extract Zona settings config bytes
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/export-network-core.yml"]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/apk-analysis
          fetch-depth: 0
      - name: Extract exact Compose resource
        run: |
          set -eux
          rm -rf /tmp/zona-config && mkdir -p /tmp/zona-config
          unzip -p zona5.apk assets/composeResources/ru.zona.common.generated.resources/values/strings.commonMain.cvr > /tmp/zona-config/strings.commonMain.cvr
          dd if=/tmp/zona-config/strings.commonMain.cvr of=/tmp/zona-config/settings_string.bin bs=1 skip=36385 count=1191 status=none
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/zona-config/settings_string.bin').read_bytes()
          Path('/tmp/zona-config/settings_string.hex.txt').write_text(b.hex()+'\n')
          Path('/tmp/zona-config/settings_string.repr.txt').write_text(repr(b)+'\n')
          for enc in ('utf-8','utf-16le','utf-16be'):
              try:
                  Path(f'/tmp/zona-config/settings_string.{enc}.txt').write_text(b.decode(enc))
              except Exception as e:
                  Path(f'/tmp/zona-config/settings_string.{enc}.txt').write_text('decode failed: '+repr(e))
          PY
      - name: Publish result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin chore/apk-analysis
          rm -rf network-core-export/builtin-config
          mkdir -p network-core-export/builtin-config
          cp /tmp/zona-config/settings_string.* network-core-export/builtin-config/
          git add -f network-core-export/builtin-config
          git commit -m "analysis: extract Zona settings config bytes [skip ci]" || exit 0
          git push origin HEAD:chore/apk-analysis
